name: Nightly Baseball Scrape

on:
  schedule:
    # 1. 毎日 17:00 (日本時間) = 08:00 (UTC)
    # デーゲームや祝日の試合に対応
    - cron: '0 8 * * *'
    
    # 2. 毎日 22:00 (日本時間) = 13:00 (UTC)
    # ナイター試合の最終結果に対応
    - cron: '0 13 * * *'
    
  workflow_dispatch: # 手動実行ボタン

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API
        run: |
          curl -X GET "${{ secrets.SCRAPE_URL }}"