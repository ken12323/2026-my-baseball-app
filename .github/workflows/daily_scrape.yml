name: Daily Baseball Update Pipeline (Scrape & Analyze)

on:
  schedule:
    # 1. 17:00 JST (デーゲーム終了目安)
    - cron: '0 8 * * *'
    # 2. 22:00 JST (ナイター終了目安)
    - cron: '0 13 * * *'
    # 3. 翌0:00 JST (深夜のデータ最終確定)
    - cron: '0 15 * * *'
    
  workflow_dispatch: # 手動実行用

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    # データベース接続情報をジョブ全体で共有
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv supabase pandas numpy beautifulsoup4 requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- 🚀 STEP 1: デイリー成績（今日・昨日）の取得 ---
      - name: Fetch Daily Performance
        run: |
          echo "昨日の試合結果を取得します..."
          YESTERDAY=$(date -d "9 hours ago -1 day" +%Y-%m-%d)
          python fetch_daily_performance.py $YESTERDAY
          
          echo "今日の試合結果を取得します..."
          python fetch_daily_performance.py

      # --- 🚀 STEP 2: シーズン成績の同期 ＆ 指標の計算 ---
      # （基礎データの取得からWARなどの計算まで、この1スクリプトで完結）
      - name: Sync Team Stats and Calculate Metrics
        run: |
          echo "シーズン累計データの取得とセイバーメトリクス計算を一括実行します..."
          python sync_team_stats.py